version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    # Security
    - gosec
    - forcetypeassert   # find unguarded type assertions
    # Correctness
    - bodyclose
    - noctx
    - errorlint
    - nilerr            # nil returned when error was checked
    - fatcontext        # context in loops can cause memory leaks
    # Database
    - sqlclosecheck     # ensures pgx queries / sql.Rows are closed
    - rowserrcheck      # ensures rows.Err() is checked
    # Code quality
    - gocritic
    - revive
    - unconvert
    - misspell
    - dupword           # catches duplicate words in comments
    - usestdlibvars     # use http.StatusOK instead of 200, etc.
    - modernize         # suggest modern Go patterns
    # Logging
    - loggercheck       # validates zap/slog structured logging calls
    # Test quality
    - testifylint       # validates testify usage patterns
    - usetesting        # use testing package helpers
    # Architecture
    - depguard          # enforces hexagonal architecture import rules

  settings:
    govet:
      enable:
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-tags:
        - style
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    misspell:
      ignore-rules:
        - speach
    depguard:
      rules:
        domain-layer:
          files:
            - "**/internal/core/domain/**"
          deny:
            - pkg: "github.com/joern1811/ai/internal/core/service"
              desc: "domain must not import the application layer (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/framework"
              desc: "domain must not import the framework/adapter layer (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/rest"
              desc: "domain must not import the REST adapter (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/cmd"
              desc: "domain must not import the CLI adapter (hexagonal architecture)"
        ports-layer:
          files:
            - "**/internal/core/ports/**"
          deny:
            - pkg: "github.com/joern1811/ai/internal/core/service"
              desc: "ports must not depend on the application layer (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/framework"
              desc: "ports must not import the framework/adapter layer (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/rest"
              desc: "ports must not import the REST adapter (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/cmd"
              desc: "ports must not import the CLI adapter (hexagonal architecture)"
        application-layer:
          files:
            - "**/internal/core/service/**"
          deny:
            - pkg: "github.com/joern1811/ai/internal/framework"
              desc: "application must not import the framework/adapter layer (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/rest"
              desc: "application must not import the REST adapter (hexagonal architecture)"
            - pkg: "github.com/joern1811/ai/internal/cmd"
              desc: "application must not import the CLI adapter (hexagonal architecture)"

  exclusions:
    rules:
      # Test files: allow http.NewRequest without context
      - path: _test\.go
        linters:
          - noctx
      # Test files: filepathJoin with separators is fine for test data
      - path: _test\.go
        text: filepathJoin
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/joern1811/ai
